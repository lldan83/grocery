<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>임직원 할인율 노트</title>
<style>
:root{--bg:#f7f6f3;--card:#fff;--tx:#1f1f1d;--tx2:#6b6a66;--bd:#e3e1db;--ac:#185fa5;--acbg:#e6f1fb;--warn:#fff3d6;--warntx:#7a4b00;--ok:#e6f4ea;--oktx:#1e6b34}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1a;--card:#262624;--tx:#eeede8;--tx2:#a5a49e;--bd:#3a3a37;--ac:#85b7eb;--acbg:#1d3550;--warn:#4a3a14;--warntx:#f5d58a;--ok:#1d3a27;--oktx:#9be0b0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding:12px;padding-top:max(12px,env(safe-area-inset-top));max-width:560px;margin:0 auto}
input,select,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;min-width:0}
button{cursor:pointer}button.p{background:var(--ac);color:var(--card);border-color:var(--ac)}
button.l{border:none;background:none;color:var(--tx2);padding:4px 6px;font-size:13px}
#q{width:100%;font-size:17px;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-top:10px}
.top{display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:8px}
.nm{font-weight:500}.sub{font-size:12px;color:var(--tx2)}
.rate{font-size:26px;font-weight:600;color:var(--ac);text-align:right;line-height:1}
.rate small{display:block;font-size:11px;font-weight:400;color:var(--tx2);margin-top:3px}
.hist{border-top:1px solid var(--bd);margin-top:10px;padding-top:4px;font-size:13px}
.h{display:flex;gap:6px;align-items:center;padding:5px 0;flex-wrap:wrap}.h .d{color:var(--tx2);width:46px}.h .m{flex:1;min-width:120px}
.row{display:grid;grid-template-columns:1fr 62px 84px 74px;gap:6px;margin-top:6px}
.tag{font-size:12px;padding:2px 8px;border-radius:8px;background:var(--acbg);color:var(--ac)}
.warn{background:var(--warn);color:var(--warntx);padding:8px 10px;border-radius:8px;font-size:13px;margin-top:8px}
.cand{display:block;width:100%;text-align:left;margin-top:6px;font-size:13px}
.f{display:flex;gap:6px;margin-top:6px}.f>*{flex:1}
#msg{font-size:13px;color:var(--tx2);margin-top:8px;min-height:18px}
h3{margin:0 0 4px;font-size:16px}
</style>
</head>
<body>
<div style="display:flex;gap:8px;align-items:center">
<input id="q" type="search" placeholder="품목 검색 (예: 로션)" autocomplete="off">
</div>
<div id="bar" style="margin-top:8px"></div>
<div id="pd"></div>
<div id="form"></div>
<div id="list"></div>
<div id="msg"></div>
<div style="text-align:center;margin-top:18px"><button class="l" id="lg"></button></div>
<div id="lgbox"></div>
<datalist id="dn"></datalist><datalist id="ds"></datalist>

<script>
const KEY="AIzaSyBMdrK4CS55QeTHPXsrERPhzSlF272wCTI",PID="grocery-discount";
const DB=`https://firestore.googleapis.com/v1/projects/${PID}/databases/(default)/documents/receipts`;
let rcps=[],tok=null,tokExp=0,owner=false,editId=null,det0=[],Q=[],pend=null;
const $=s=>document.querySelector(s),r10=x=>Math.round(x/10)*10,paidOf=(p,r)=>p-r10(p*r/100);
const won=n=>Number(n).toLocaleString("ko-KR"),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const msg=t=>$("#msg").textContent=t||"";
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const gv=f=>!f?"":f.nullValue!==undefined?null:f.stringValue!==undefined?f.stringValue:f.integerValue!==undefined?+f.integerValue:f.doubleValue;
const key=s=>s.trim().toLowerCase();
const STOP=new Set(["국산","유기농","냉동","냉장","무농약","친환경","수입","행사"]);
const toks=n=>n.toLowerCase().replace(/[0-9.]+\s*(입|개|ml|l|kg|g|팩|봉|ea|구|단|병|캔)?/gi," ").replace(/[^\p{L}\s]/gu," ").split(/\s+/).filter(t=>t.length>=2&&!STOP.has(t));
const ov=(a,b)=>a.some(x=>b.some(y=>x==y||x.includes(y)||y.includes(x)));

function sysSolve(recs,G){
  const det={},und=new Set(),bad=[],rs=recs.filter(r=>r.total!=null);
  const rv=r=>[...new Set(r.items.map(i=>i.grp).filter(g=>!(g in G)))];
  const sum=(r,m)=>r.items.reduce((s,i)=>s+r10(i.price*(i.grp in G?G[i.grp]:m[i.grp])/100),0);
  rs.filter(r=>!rv(r).length).forEach(r=>{if(Math.abs(sum(r,{})-r.total)>10)bad.push(r)});
  const comps=[];
  rs.filter(r=>rv(r).length).forEach(r=>{
    const vs=rv(r),hit=comps.filter(c=>vs.some(v=>c.v.has(v))),c={v:new Set(vs),r:[r]};
    hit.forEach(h=>{h.v.forEach(v=>c.v.add(v));c.r.push(...h.r);comps.splice(comps.indexOf(h),1)});
    comps.push(c);
  });
  comps.forEach(c=>{
    const V=[...c.v];
    if(V.length>18){V.forEach(v=>und.add(v));return}
    const sol=[];
    for(let m=0;m<(1<<V.length);m++){
      const a={};V.forEach((v,i)=>a[v]=(m>>i&1)?10:5);
      if(c.r.every(r=>Math.abs(sum(r,a)-r.total)<=10))sol.push(a);
    }
    if(!sol.length){V.forEach(v=>und.add(v));c.r.forEach(r=>bad.push(r));return}
    V.forEach(v=>{const s=new Set(sol.map(a=>a[v]));s.size==1?det[v]=[...s][0]:und.add(v)});
  });
  return {det,und,bad};
}
const flat=()=>rcps.flatMap(r=>r.items.map(i=>({...i,date:r.date,store:r.store,rid:r.id})));
const grMap=ex=>{const g={};[...rcps].filter(r=>r.id!==ex).sort((a,b)=>a.date.localeCompare(b.date)).forEach(r=>r.items.forEach(i=>{if(i.rate!=null)g[i.grp]=i.rate}));return g};
const exactGrp=n=>{const x=flat().find(i=>key(i.name)===key(n));return x&&x.grp};
const gname=g=>flat().filter(i=>i.grp===g).reduce((m,i)=>i.name.length<m.length?i.name:m,"~".repeat(99));

const dec=d=>{const f=d.fields||{};return{id:d.name.split("/").pop(),date:gv(f.date),store:gv(f.store),total:f.total?gv(f.total):null,items:((f.items&&f.items.arrayValue.values)||[]).map(v=>{const g=v.mapValue.fields;return{name:gv(g.name),qty:gv(g.qty),price:gv(g.price),rate:gv(g.rate),grp:gv(g.grp)}})}};
const enc=o=>({fields:{date:{stringValue:o.date},store:{stringValue:o.store},total:o.total==null?{nullValue:null}:{integerValue:String(o.total)},items:{arrayValue:{values:o.items.map(i=>({mapValue:{fields:{name:{stringValue:i.name},qty:{stringValue:i.qty},price:{integerValue:String(i.price)},rate:i.rate==null?{nullValue:null}:{doubleValue:i.rate},grp:{stringValue:i.grp}}}}))}}}});

async function load(){
  let all=[],pt="";
  do{
    const r=await fetch(`${DB}?pageSize=300&key=${KEY}${pt?"&pageToken="+pt:""}`),j=await r.json();
    if(j.error)throw new Error(j.error.message);
    (j.documents||[]).forEach(d=>all.push(dec(d)));pt=j.nextPageToken||"";
  }while(pt);
  rcps=all;render();await resolveAll();
}
async function resolveAll(){
  if(!owner)return;
  const gr=grMap(null),{det}=sysSolve(rcps.map(r=>({date:r.date,total:r.total,items:r.items})),gr);let n=0;
  try{
    for(const r of rcps){let ch=false;
      r.items.forEach(i=>{if(i.rate==null){const v=i.grp in gr?gr[i.grp]:det[i.grp];if(v!=null){i.rate=v;ch=true}}});
      if(ch){await api("PATCH",r.id,enc(r));n++}}
  }catch(e){msg("자동 확정 실패: "+e.message);return}
  if(n){msg(`미확정이던 영수증 ${n}건의 할인율을 확정했어요.`);render()}
}
async function auth(){
  if(tok&&Date.now()<tokExp-6e4)return tok;
  const rt=localStorage.getItem("rt");if(!rt)return null;
  const r=await fetch(`https://securetoken.googleapis.com/v1/token?key=${KEY}`,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:`grant_type=refresh_token&refresh_token=${rt}`}),j=await r.json();
  if(!j.id_token){localStorage.removeItem("rt");return null}
  tok=j.id_token;tokExp=Date.now()+j.expires_in*1000;localStorage.setItem("rt",j.refresh_token);return tok;
}
async function login(){
  const r=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${KEY}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("#em").value,password:$("#pw").value,returnSecureToken:true})}),j=await r.json();
  if(!j.idToken){msg("로그인에 실패했어요. 이메일과 비밀번호를 확인하세요.");return}
  tok=j.idToken;tokExp=Date.now()+j.expiresIn*1000;localStorage.setItem("rt",j.refreshToken);owner=true;$("#lgbox").innerHTML="";msg("");render();resolveAll();
}
async function api(method,id,body){
  const t=await auth();if(!t)throw new Error("로그인이 필요해요");
  const r=await fetch(DB+(id?"/"+id:"")+`?key=${KEY}`,{method,headers:{Authorization:"Bearer "+t,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));if(j.error)throw new Error(j.error.message);return j;
}

function render(){
  $("#lg").textContent=owner?"로그아웃":"편집 로그인";
  $("#bar").innerHTML=owner&&!$("#form").innerHTML?`<button class="p" onclick="openForm()" style="width:100%">+ 영수증 기록</button>`:"";
  const fl=flat();
  $("#dn").innerHTML=[...new Set(fl.map(i=>i.name))].map(n=>`<option value="${esc(n)}">`).join("");
  $("#ds").innerHTML=[...new Set(fl.map(i=>i.store).filter(Boolean))].map(n=>`<option value="${esc(n)}">`).join("");
  const q=key($("#q").value),pr=rcps.filter(r=>r.items.some(i=>i.rate==null));
  $("#pd").innerHTML=pr.length&&!q?`<div class="card"><div class="nm">미확정 ${pr.length}건</div>`+pr.map(r=>`<div class="h"${owner?` style="cursor:pointer" onclick="ed('${r.id}')"`:""}><span class="d">${r.date.slice(5).replace("-","/")}</span><span class="m">${esc(r.store||"-")} · ${r.items.filter(i=>i.rate==null).map(i=>esc(i.name)).join(", ")}</span></div>`).join("")+`<div class="sub">비슷한 품목이 있는 새 영수증이 들어오면 함께 계산해요.</div></div>`:"";
  const g={};fl.forEach(i=>(g[i.grp]=g[i.grp]||[]).push(i));
  const gs=Object.values(g).map(a=>a.sort((x,y)=>y.date.localeCompare(x.date))).filter(a=>!q||a.some(i=>key(i.name).includes(q))).sort((x,y)=>y[0].date.localeCompare(x[0].date));
  render.gl=gs.map(a=>a[0].grp);const O=render.o=render.o||new Set();
  $("#list").innerHTML=gs.length?gs.map((a,n)=>{
    const c=a.find(i=>i.rate!=null),cr=c?c.rate:null,names=new Set(a.map(i=>key(i.name))),mix=new Set(a.filter(i=>i.rate!=null).map(i=>i.rate)).size>1;
    const op=O.has(a[0].grp)||(q&&gs.length<=2),title=a.reduce((m,i)=>i.name.length<m.length?i.name:m,a[0].name);
    return `<div class="card"><div class="top" onclick="tg(${n})"><div><div class="nm">${esc(title)}</div><div class="sub">기록 ${a.length}회${names.size>1?" · 이름 "+names.size+"개 묶음":""} · 마지막 ${a[0].date.slice(5).replace("-","/")}</div></div><div class="rate">${cr!=null?cr+"%":"?"}<small>${cr==null?"미확정":mix?"할인율 섞임":"임직원 할인"}</small></div></div>`+
    (op?`<div class="hist">${a.map(i=>`<div class="h"><span class="d">${i.date.slice(2)}</span><span class="m">${esc(i.name)}${i.qty?" · "+esc(i.qty):""} · ${esc(i.store||"-")}<br>${i.rate!=null?won(i.price)+" → "+won(paidOf(i.price,i.rate)):won(i.price)}</span><span class="tag">${i.rate!=null?i.rate+"%":"미확정"}</span>${owner?`<button class="l" onclick="ed('${i.rid}')">영수증 수정</button>`:""}</div>`).join("")}</div>`:"")+`</div>`;
  }).join(""):`<div class="sub" style="margin-top:16px;text-align:center">${rcps.length?"검색 결과가 없어요.":"아직 기록이 없어요."}</div>`;
}
function tg(n){const s=render.o,k=render.gl[n];s.has(k)?s.delete(k):s.add(k);render()}

function rowHtml(r={}){
  return `<div class="row"${r.grp?` data-grp="${esc(r.grp)}"`:""}><input class="n" list="dn" placeholder="품목" value="${esc(r.name||"")}" oninput="hint(this)"><input class="u" placeholder="수량" value="${esc(r.qty||"")}"><input class="p" type="number" inputmode="numeric" placeholder="판매가" value="${r.price||""}"><select class="r"><option value="">자동</option><option value="5"${r.rate==5?" selected":""}>5%</option><option value="10"${r.rate==10?" selected":""}>10%</option></select><div class="sub k" style="grid-column:1/-1"></div></div>`;
}
function hint(el){
  const row=el.parentNode;delete row.dataset.grp;
  const g=exactGrp(el.value),r=g!=null?grMap(editId)[g]:null;
  row.querySelector(".k").textContent=r!=null?`기록된 할인율 ${r}% 자동 적용`:"";
}
function openForm(r){
  editId=r?r.id:null;det0=[];
  $("#form").innerHTML=`<div class="card"><h3>${r?"영수증 수정":"영수증 기록"}</h3>
  <div class="f"><input id="fd" type="date" value="${r?r.date:today()}"><input id="fs" list="ds" placeholder="구매처" value="${r?esc(r.store):""}"></div>
  <div id="rows">${r?r.items.map(rowHtml).join(""):rowHtml()}</div>
  <button class="l" onclick="$('#rows').insertAdjacentHTML('beforeend',rowHtml())">+ 품목 추가</button>
  <div class="f"><input id="tot" type="number" inputmode="numeric" placeholder="영수증 전체 할인액" value="${r&&r.total!=null?r.total:""}"><button onclick="solve()">할인율 역산</button></div>
  <div id="cd"></div>
  <div class="f" style="margin-top:10px"><button onclick="closeForm()">취소</button>${r?`<button onclick="delR()">삭제</button>`:""}<button class="p" onclick="save()">저장</button></div></div>`;
  $("#bar").innerHTML="";document.querySelectorAll("#rows .row").forEach(el=>{const k=el.querySelector(".k"),n=el.querySelector(".n").value;if(n){const g=exactGrp(n),x=g!=null?grMap(editId)[g]:null;k.textContent=x!=null?`기록된 할인율 ${x}% 자동 적용`:""}});$("#form").scrollIntoView();
}
function closeForm(){$("#form").innerHTML="";editId=null;render()}
function readRows(){
  return [...document.querySelectorAll("#rows .row")].map(el=>{const name=el.querySelector(".n").value.trim();return{el,name,qty:el.querySelector(".u").value.trim(),price:+el.querySelector(".p").value,sel:el.querySelector(".r").value,grp:el.dataset.grp||exactGrp(name)||key(name)}}).filter(r=>r.name||r.price);
}
function askQ(cb){
  const R=readRows().filter(r=>r.name&&r.price),gs=[...new Set(flat().map(i=>i.grp))],fl=flat();
  Q=[];pend=cb;
  R.forEach(r=>{
    if(r.el.dataset.grp)return;
    const ex=exactGrp(r.name);if(ex){r.el.dataset.grp=ex;return}
    const t=toks(r.name),g=t.length&&gs.find(g=>fl.some(i=>i.grp===g&&ov(t,toks(i.name))));
    g?Q.push({r,g}):r.el.dataset.grp=key(r.name);
  });
  if(!Q.length)return false;
  $("#cd").innerHTML=Q.map((q,i)=>`<div class="card" id="q${i}" style="border:2px solid var(--ac)"><div><b>${esc(q.r.name)}</b>이(가) 기존 <b>${esc(gname(q.g))}</b>과(와) 같은 품목인가요?</div><div class="f"><button onclick="ans(${i},1)">맞아요</button><button onclick="ans(${i},0)">아니에요</button></div></div>`).join("");
  return true;
}
function ans(i,y){const q=Q[i];q.r.el.dataset.grp=y?q.g:key(q.r.name);q.done=1;$("#q"+i).remove();if(Q.every(x=>x.done)){$("#cd").innerHTML="";pend()}}
function solve(){
  if(askQ(solve))return;
  const tot=+$("#tot").value,R=readRows().filter(r=>r.name&&r.price);
  if(!tot||!R.length){$("#cd").innerHTML=`<div class="warn">품목 판매가와 전체 할인액을 먼저 입력하세요.</div>`;return}
  const G=grMap(editId);R.forEach(r=>{if(r.sel)G[r.grp]=+r.sel});
  const recs=rcps.filter(x=>x.id!==editId).map(x=>({date:x.date,total:x.total,items:x.items})).concat([{date:"이번 영수증",total:tot,items:R.map(r=>({price:r.price,grp:r.grp}))}]);
  const {det,und,bad}=sysSolve(recs,G),mine=new Set(R.map(r=>r.grp));
  const known=new Set(Object.keys(grMap(editId)).concat(R.filter(r=>r.sel).map(r=>r.grp)));
  det0=R.filter(r=>r.grp in det&&!known.has(r.grp)).map(r=>[r,det[r.grp]]);
  const un=R.filter(r=>und.has(r.grp)&&!known.has(r.grp));
  let h="";
  if(bad.length)h+=`<div class="warn">이 영수증과 기존 기록이 안 맞아요 (관련: ${[...new Set(bad.map(b=>b.date))].join(", ")}). 할인액이나 품목을 확인하세요. 저장은 가능해요.</div>`;
  if(det0.length)h+=`<div class="warn" style="background:var(--ok);color:var(--oktx)">확정: ${det0.map(([r,x])=>esc(r.name)+" "+x+"%").join(", ")}</div>`;
  if(un.length)h+=`<div class="warn">미정: ${un.map(r=>esc(r.name)+" (5 또는 10%)").join(", ")}<br>미확정으로 저장되고, 나중에 확정되면 자동으로 채워져요. 아는 품목은 직접 선택해도 돼요.</div>`;
  if(!h)h=`<div class="warn">모든 품목의 할인율이 이미 정해져 있어요.</div>`;
  $("#cd").innerHTML=h+(det0.length?`<button class="cand" onclick="apply()">확정분 적용</button>`:"");
}
function apply(){det0.forEach(([r,x])=>r.el.querySelector(".r").value=String(x));msg("확정분을 적용했어요.")}
async function save(){
  try{
    if(askQ(save))return;
    const date=$("#fd").value,store=$("#fs").value.trim(),tot=$("#tot").value?+$("#tot").value:null,R=readRows();
    if(!date||!R.length)return msg("날짜와 품목을 입력하세요.");
    for(const r of R)if(!r.name||!r.price)return msg("품목명과 판매가를 입력하세요.");
    const gr=grMap(editId),its=R.map(r=>({name:r.name,qty:r.qty,price:r.price,grp:r.grp,rate:r.sel?+r.sel:(r.grp in gr?gr[r.grp]:null)}));
    msg("저장 중…");
    const o={date,store,total:tot,items:its};
    editId?await api("PATCH",editId,enc(o)):await api("POST","",enc(o));
    const np=its.filter(i=>i.rate==null).length;
    closeForm();msg(np?`저장했어요. ${np}건은 미확정이에요.`:"저장했어요.");await load();
  }catch(e){msg("저장 실패: "+e.message)}
}
function ed(id){openForm(rcps.find(r=>r.id===id))}
async function delR(){if(!confirm("이 영수증을 삭제할까요?"))return;try{await api("DELETE",editId);closeForm();await load()}catch(e){msg("삭제 실패: "+e.message)}}

$("#q").oninput=render;
$("#lg").onclick=()=>{
  if(owner){localStorage.removeItem("rt");tok=null;owner=false;closeForm();return}
  $("#lgbox").innerHTML=`<div class="card"><div class="f"><input id="em" type="email" placeholder="이메일"><input id="pw" type="password" placeholder="비밀번호"></div><button class="p" style="width:100%;margin-top:8px" onclick="login()">로그인</button></div>`;
};
