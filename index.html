<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>임직원 할인율 노트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--bg:#f4f3ee;--card:#fff;--tx:#1f1f1d;--tx2:#73726c;--bd:#e6e4dd;--ac:#185fa5;--acbg:#e6f1fb;--warn:#faeeda;--warntx:#854f0b;--ok:#eaf3de;--oktx:#3b6d11;--gray:#f1efe8}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1a;--card:#262624;--tx:#eeede8;--tx2:#a5a49e;--bd:#3a3a37;--ac:#85b7eb;--acbg:#1d3550;--warn:#4a3a14;--warntx:#f5d58a;--ok:#1d3a27;--oktx:#9be0b0;--gray:#33332f}}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--tx);font:14px/1.5 Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding:14px;padding-top:max(14px,env(safe-area-inset-top));max-width:560px;-webkit-font-smoothing:antialiased}
input,select,button{font:inherit;font-size:14px;color:var(--tx);background:var(--card);border:.5px solid var(--bd);border-radius:10px;padding:9px 12px;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--ac)}
button{cursor:pointer}button.p{background:var(--tx);color:var(--card);border-color:var(--tx)}
button.l{border:none;background:none;color:var(--tx2);padding:4px 6px;font-size:12px}
#q{width:100%;font-size:15px;padding:12px 14px;border-radius:12px}
.card{background:var(--card);border:.5px solid var(--bd);border-radius:12px;padding:12px 14px;margin-top:10px}
.top{display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:8px}
.nm{font-weight:500;font-size:15px}.sub{font-size:12px;color:var(--tx2)}
.rate{text-align:right;white-space:nowrap}
.rate b{display:block;font-size:22px;font-weight:500;color:var(--ac);line-height:1.1}
.rate small{display:block;font-size:11px;color:var(--tx2);margin-top:2px}
.hist{border-top:.5px solid var(--bd);margin-top:10px;padding-top:4px;font-size:12.5px}
.h{display:flex;gap:8px;align-items:center;padding:6px 0;flex-wrap:wrap}.h .d{color:var(--tx2);width:46px}.h .m{flex:1;min-width:120px}
.tag,.b{font-size:11px;padding:2px 8px;border-radius:8px;white-space:nowrap}
.tag{background:var(--acbg);color:var(--ac)}
.tag.un,.b.un{background:var(--gray);color:var(--tx2)}
.warn{background:var(--warn);color:var(--warntx);padding:8px 10px;border-radius:10px;font-size:12.5px;margin-top:8px}
.cand{display:block;width:100%;margin-top:8px;font-size:13px}
.f{display:flex;gap:6px;margin-top:6px}.f>*{flex:1}
#msg{font-size:12px;color:var(--tx2);margin-top:8px;min-height:18px}
h3{margin:0;font-size:15px;font-weight:500}
.it{background:var(--bg);border-radius:10px;padding:8px;margin-top:8px}
.l1{display:grid;grid-template-columns:1fr 100px;gap:6px}
.l2{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.sg{display:inline-flex;border:.5px solid var(--bd);border-radius:10px;overflow:hidden}
.sg button{border:none;border-radius:0;padding:6px 12px;background:var(--card);font-size:13px}
.sg button.on{background:var(--ac);color:#fff}
#fb{position:fixed;left:0;right:0;bottom:0;display:none;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:.5px solid var(--bd);max-width:560px;margin:0 auto;z-index:5}
#fb button{flex:1}
.sec{display:flex;justify-content:space-between;align-items:center;padding:13px 0;cursor:pointer;font-size:15px;border-top:.5px solid var(--bd)}
.sec:first-child{border-top:none}
.pi{display:flex;align-items:center;gap:8px;padding:9px 0 9px 10px;font-size:14px;cursor:pointer;border-top:.5px solid var(--bd)}
.pi:first-child{border-top:none}
.pi .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{font-size:12px;color:var(--tx2);white-space:nowrap}
.ev{font-size:11px;padding:1px 7px;border-radius:8px;background:var(--warn);color:var(--warntx);white-space:nowrap}
.dt{background:var(--bg);border-radius:8px;padding:8px 10px;margin:0 0 8px 10px;font-size:12.5px}
.dt .r1{display:flex;justify-content:space-between;gap:6px;align-items:center}
</style>
</head>
<body>
<div style="display:flex;gap:8px;align-items:center">
<input id="q" type="search" placeholder="품목 검색 (예: 로션)" autocomplete="off">
</div>
<div id="bar" style="margin-top:8px"></div>
<div id="pd"></div>
<div id="form"></div>
<div id="list"></div>
<div id="msg"></div>
<div style="text-align:center;margin-top:18px"><button class="l" id="lg"></button></div>
<div id="lgbox"></div>
<div id="fb"><button onclick="addRow()">+ 품목</button><button onclick="solve()">역산</button><button class="p" onclick="save()">저장</button></div>
<datalist id="dn"></datalist><datalist id="ds"></datalist>

<script>
const KEY="AIzaSyBMdrK4CS55QeTHPXsrERPhzSlF272wCTI",PID="grocery-discount";
const DB=`https://firestore.googleapis.com/v1/projects/${PID}/databases/(default)/documents/receipts`;
let rcps=[],tok=null,tokExp=0,owner=false,editId=null,det0=[];
const $=s=>document.querySelector(s),r10=x=>Math.round(x/10)*10;
const won=n=>Number(n).toLocaleString("ko-KR"),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const msg=t=>$("#msg").textContent=t||"";
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const gv=f=>!f?"":f.nullValue!==undefined?null:f.stringValue!==undefined?f.stringValue:f.integerValue!==undefined?+f.integerValue:f.doubleValue;
const key=s=>s.trim().toLowerCase(),num=v=>+String(v).replace(/[^0-9]/g,"")||0;

function sysSolve(recs,G){
  const det={},und=new Set(),bad=[],stat={},rs=recs.filter(r=>r.total!=null);
  let loose=false;
  const rv=r=>[...new Set(r.items.map(i=>i.grp).filter(g=>!(g in G)))];
  const base=i=>i.price-(i.post?(i.ev||0):0);
  const sum=(r,m)=>r.items.reduce((s,i)=>s+r10(base(i)*(i.grp in G?G[i.grp]:m[i.grp])/100),0);
  rs.filter(r=>!rv(r).length).forEach(r=>{if(Math.abs(sum(r,{})-r.total)>10)bad.push(r)});
  const comps=[];
  rs.filter(r=>rv(r).length).forEach(r=>{
    const vs=rv(r),hit=comps.filter(c=>vs.some(v=>c.v.has(v))),c={v:new Set(vs),r:[r]};
    hit.forEach(h=>{h.v.forEach(v=>c.v.add(v));c.r.push(...h.r);comps.splice(comps.indexOf(h),1)});
    comps.push(c);
  });
  comps.forEach(c=>{
    const V=[...c.v];
    if(V.length>18){V.forEach(v=>und.add(v));return}
    const all=[];
    for(let m=0;m<(1<<V.length);m++){
      const a={};V.forEach((v,i)=>a[v]=(m>>i&1)?10:5);
      const d=Math.max(...c.r.map(r=>Math.abs(sum(r,a)-r.total)));
      if(d<=10)all.push([d,a]);
    }
    let sol=all.filter(x=>x[0]===0).map(x=>x[1]);
    if(!sol.length){sol=all.map(x=>x[1]);loose=true}
    if(!sol.length){V.forEach(v=>und.add(v));c.r.forEach(r=>bad.push(r));return}
    V.forEach(v=>{const x=new Set(sol.map(a=>a[v]));stat[v]=[sol.filter(a=>a[v]==10).length,sol.length];x.size==1?det[v]=[...x][0]:und.add(v)});
  });
  return {det,und,bad,stat,loose};
}
const toRec=x=>({date:x.date,total:x.total,items:x.items.map(i=>({price:i.price,ev:i.ev,grp:i.grp,post:i.evb==="post"}))});
const flat=()=>rcps.flatMap(r=>r.items.map(i=>({...i,date:r.date,store:r.store,rid:r.id})));
const grMap=ex=>{const g={};[...rcps].filter(r=>r.id!==ex).sort((a,b)=>a.date.localeCompare(b.date)).forEach(r=>r.items.forEach(i=>{if(i.rate!=null)g[i.grp]=i.rate}));return g};

const dec=d=>{const f=d.fields||{};return{id:d.name.split("/").pop(),date:gv(f.date),store:gv(f.store),total:f.total?gv(f.total):null,items:((f.items&&f.items.arrayValue.values)||[]).map(v=>{const g=v.mapValue.fields,n=gv(g.name);return{name:n,qty:g.qty?gv(g.qty):"",price:gv(g.price),ev:g.ev?gv(g.ev):0,evm:g.evm?gv(g.evm):"",evb:g.evb?gv(g.evb):"",rate:gv(g.rate),grp:key(n)}})}};
const enc=o=>({fields:{date:{stringValue:o.date},store:{stringValue:o.store},total:o.total==null?{nullValue:null}:{integerValue:String(o.total)},items:{arrayValue:{values:o.items.map(i=>({mapValue:{fields:{name:{stringValue:i.name},qty:{stringValue:i.qty||""},price:{integerValue:String(i.price)},ev:{integerValue:String(i.ev||0)},evm:{stringValue:i.evm||""},evb:{stringValue:i.evb||""},rate:i.rate==null?{nullValue:null}:{doubleValue:i.rate},grp:{stringValue:i.grp}}}}))}}}});

async function load(){
  let all=[],pt="";
  do{
    const r=await fetch(`${DB}?pageSize=300&key=${KEY}${pt?"&pageToken="+pt:""}`),j=await r.json();
    if(j.error)throw new Error(j.error.message);
    (j.documents||[]).forEach(d=>all.push(dec(d)));pt=j.nextPageToken||"";
  }while(pt);
  rcps=all;render();await resolveAll();
}
async function resolveAll(){
  if(!owner)return;
  const gr=grMap(null),{det}=sysSolve(rcps.map(toRec),gr);let n=0,m=0;
  try{
    for(const r of rcps){
      let ch=false;
      r.items.forEach(i=>{if(i.rate==null){const v=i.grp in gr?gr[i.grp]:det[i.grp];if(v!=null){i.rate=v;ch=true}}});
      const au=r.items.filter(i=>i.ev&&!i.evb);
      if(au.length&&au.length<=4&&r.total!=null&&r.items.every(i=>i.rate!=null)){
        const val=[];
        for(let k=0;k<(1<<au.length);k++){
          const s=r.items.reduce((a,i)=>{const x=au.indexOf(i),po=x>=0&&(k>>x&1);return a+r10((i.price-((i.evb==="post"||po)?i.ev:0))*i.rate/100)},0);
          val.push([Math.abs(s-r.total),k]);
        }
        let c=val.filter(v=>v[0]===0);if(!c.length)c=val.filter(v=>v[0]<=10);
        if(c.length===1){au.forEach((i,x)=>i.evb=(c[0][1]>>x&1)?"post":"pre");ch=true;m++}
      }
      if(ch){await api("PATCH",r.id,enc(r));n++}
    }
  }catch(e){msg("자동 정리 실패: "+e.message);return}
  if(n){msg(`자동 정리 ${n}건 (행사 기준 판별 ${m}건)`);render()}
}
async function auth(){
  if(tok&&Date.now()<tokExp-6e4)return tok;
  const rt=localStorage.getItem("rt");if(!rt)return null;
  const r=await fetch(`https://securetoken.googleapis.com/v1/token?key=${KEY}`,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:`grant_type=refresh_token&refresh_token=${rt}`}),j=await r.json();
  if(!j.id_token){localStorage.removeItem("rt");return null}
  tok=j.id_token;tokExp=Date.now()+j.expires_in*1000;localStorage.setItem("rt",j.refresh_token);return tok;
}
async function login(){
  const r=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${KEY}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("#em").value,password:$("#pw").value,returnSecureToken:true})}),j=await r.json();
  if(!j.idToken){msg("로그인에 실패했어요. 이메일과 비밀번호를 확인하세요.");return}
  tok=j.idToken;tokExp=Date.now()+j.expiresIn*1000;localStorage.setItem("rt",j.refreshToken);owner=true;$("#lgbox").innerHTML="";msg("");render();resolveAll();
}
async function api(method,id,body){
  const t=await auth();if(!t)throw new Error("로그인이 필요해요");
  const r=await fetch(DB+(id?"/"+id:"")+`?key=${KEY}`,{method,headers:{Authorization:"Bearer "+t,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));if(j.error)throw new Error(j.error.message);return j;
}

function detail(i){
  const b=i.ev?(i.evb==="post"?`행사 후 금액(${won(i.price-i.ev)})에 적용`:i.evb==="pre"?`행사 전 금액(${won(i.price)})에 적용`:"행사 기준 미판별"):"";
  return `<div class="dt"><div class="r1"><span class="sub">${i.date.slice(5).replace("-","/")} · ${esc(i.store||"-")}</span><span class="tag${i.rate==null?" un":""}">${i.rate==null?"미확정":i.rate+"%"}</span></div><div>${won(i.price)}원${i.ev?` · <b>행사 −${won(i.ev)}</b>${i.evm?` (${esc(i.evm)})`:""}`:""}</div>${b?`<div class="sub">임직원 할인: ${b}</div>`:""}${owner?`<button class="l" onclick="ed('${i.rid}')" style="padding-left:0">영수증 수정</button>`:""}</div>`;
}
function render(){
  $("#lg").textContent=owner?"로그아웃":"편집 로그인";
  $("#bar").innerHTML=owner&&!$("#form").innerHTML?`<button class="p" onclick="openForm()" style="width:100%">+ 영수증 기록</button>`:"";
  const fl=flat();
  $("#dn").innerHTML=[...new Set(fl.map(i=>i.name))].map(n=>`<option value="${esc(n)}">`).join("");
  $("#ds").innerHTML=[...new Set(fl.map(i=>i.store).filter(Boolean))].map(n=>`<option value="${esc(n)}">`).join("");
  const q=key($("#q").value),g={};
  fl.forEach(i=>(g[i.grp]=g[i.grp]||[]).push(i));
  const gs=Object.values(g).map(a=>{a.sort((x,y)=>y.date.localeCompare(x.date));const c=a.find(i=>i.rate!=null);return{a,name:a[0].name,cr:c?c.rate:null,mix:new Set(a.filter(i=>i.rate!=null).map(i=>i.rate)).size>1,ev:a.some(i=>i.ev>0)}});
  render.k=[];const O=render.o=render.o||new Set(),S=render.s=render.s||new Set();
  const row=(x,sh)=>{
    const k=x.a[0].grp,n=render.k.push(k)-1;
    return `<div class="pi" onclick="ti(${n})"><span class="n">${esc(x.name)}</span>${x.ev?`<span class="ev">행사</span>`:""}${x.mix?`<span class="cnt">섞임</span>`:""}<span class="cnt">×${x.a.length}</span>${sh?`<span class="tag${x.cr==null?" un":""}">${x.cr==null?"미확정":x.cr+"%"}</span>`:""}</div>`+(O.has(k)?x.a.map(detail).join(""):"");
  };
  const none=`<div class="sub" style="margin-top:16px;text-align:center">${q?"검색 결과가 없어요.":"아직 기록이 없어요."}</div>`;
  let h;
  if(q){
    const m=gs.filter(x=>x.a.some(i=>key(i.name).includes(q))).sort((x,y)=>y.a.length-x.a.length||y.a[0].date.localeCompare(x.a[0].date));
    h=m.length?`<div class="card" style="padding-top:2px;padding-bottom:2px">`+m.map(x=>row(x,1)).join("")+`</div>`:none;
  }else if(!gs.length)h=none;
  else{
    const secs=[["5","5%",x=>x.cr==5],["10","10%",x=>x.cr==10],["u","미확정",x=>x.cr!=5&&x.cr!=10]];
    h=`<div class="card" style="padding-top:0;padding-bottom:0">`+secs.map(([id,t,f])=>{
      const l=gs.filter(f).sort((x,y)=>x.name.localeCompare(y.name,"ko"));
      if(!l.length&&id==="u")return "";
      const op=S.has(id);
      return `<div class="sec" onclick="ts('${id}')"><span${op?' style="font-weight:500"':""}>${t}</span><span class="cnt">${l.length}개 ${op?"⌄":"›"}</span></div>`+(op?l.map(x=>row(x,0)).join(""):"");
    }).join("")+`</div>`;
  }
  $("#list").innerHTML=h;
}
const ts=id=>{const s=render.s;s.has(id)?s.delete(id):s.add(id);render()};
const ti=n=>{const s=render.o,k=render.k[n];s.has(k)?s.delete(k):s.add(k);render()};

const seg=(arr,cur,k,cls)=>`<span class="sg ${cls}">${arr.map(([v,t])=>`<button type="button" class="${cur===v?"on":""}" data-v="${v}" onclick="setX(this,'${k}')">${t}</button>`).join("")}</span>`;
function rowHtml(r={}){
  const rt=r.rate==null?"":String(r.rate),eb=r.evb||"";
  return `<div class="it" data-rate="${rt}" data-evb="${eb}"><div class="l1"><input class="n" lang="ko" list="dn" placeholder="품목명" value="${esc(r.name||"")}" oninput="hint(this)"><input class="p" type="text" inputmode="numeric" placeholder="금액" value="${r.price||""}" onkeydown="if(event.key==='Enter'){event.preventDefault();addRow()}"></div><div class="l2">${seg([["5","5%"],["10","10%"],["","미정"]],rt,"rate","r1")}<button type="button" class="l" onclick="evT(this)">+ 행사</button></div><div class="l2 l3" style="display:${r.ev?"flex":"none"}"><input class="e" type="text" inputmode="numeric" placeholder="차감액" style="width:84px" value="${r.ev||""}"><input class="em" placeholder="행사 메모" style="flex:1" value="${esc(r.evm||"")}">${seg([["","자동"],["pre","전"],["post","후"]],eb,"evb","b2")}</div><div class="sub k"></div></div>`;
}
function setX(b,k){b.closest(".it").dataset[k]=b.dataset.v;b.parentNode.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b))}
function evT(b){const e=b.closest(".it").querySelector(".l3");e.style.display=e.style.display==="none"?"flex":"none";if(e.style.display==="flex")e.querySelector(".e").focus()}
function addRow(){
  $("#rows").insertAdjacentHTML("beforeend",rowHtml());
  const n=document.querySelectorAll("#rows .it .n"),el=n[n.length-1];el.focus();el.scrollIntoView({block:"center"});
}
function hint(el){
  const g=key(el.value),r=g?grMap(editId)[g]:null;
  el.closest(".it").querySelector(".k").textContent=r!=null?`기록된 할인율 ${r}% 자동 적용`:"";
}
function openForm(r){
  editId=r?r.id:null;det0=[];
  $("#form").innerHTML=`<div class="card"><div class="top"><h3>${r?"영수증 수정":"영수증 기록"}</h3><button class="l" onclick="closeForm()">닫기</button></div>
  <div class="f"><input id="fd" type="date" value="${r?r.date:today()}"><input id="fs" list="ds" placeholder="구매처" value="${r?esc(r.store):""}"></div>
  <div id="rows">${r?r.items.map(rowHtml).join(""):rowHtml()}</div>
  <div class="f"><input id="tot" type="text" inputmode="numeric" placeholder="영수증 전체 할인액" value="${r&&r.total!=null?r.total:""}"></div>
  <div id="cd"></div>${r?`<button class="l" onclick="delR()" style="margin-top:8px">이 영수증 삭제</button>`:""}</div>`;
  $("#bar").innerHTML="";$("#fb").style.display="flex";document.body.style.paddingBottom="80px";
  document.querySelectorAll("#rows .n").forEach(el=>{if(el.value)hint(el)});
  $("#form").scrollIntoView();
}
function closeForm(){$("#form").innerHTML="";editId=null;$("#fb").style.display="none";document.body.style.paddingBottom="";render()}
function readRows(){
  return [...document.querySelectorAll("#rows .it")].map(el=>{const name=el.querySelector(".n").value.trim();return{el,name,price:num(el.querySelector(".p").value),ev:num(el.querySelector(".e").value),evm:el.querySelector(".em").value.trim(),evb:el.dataset.evb||"",sel:el.dataset.rate||"",grp:key(name)}}).filter(r=>r.name||r.price);
}
function suspects(recs,G,R){
  const out=[];
  [...new Set(R.map(r=>r.grp))].filter(g=>g in G).forEach(g=>{
    const G2={...G};delete G2[g];
    const x=sysSolve(recs,G2);
    if(!x.bad.length)out.push({g,old:G[g],need:x.det[g]});
  });
  return out;
}
function solve(){
  const tot=num($("#tot").value),R=readRows().filter(r=>r.name&&r.price);
  if(!tot||!R.length){$("#cd").innerHTML=`<div class="warn">품목 금액과 전체 할인액을 먼저 입력하세요.</div>`;return}
  const G=grMap(editId);R.forEach(r=>{if(r.sel)G[r.grp]=+r.sel});
  const base=rcps.filter(x=>x.id!==editId).map(toRec),au=R.filter(r=>r.ev&&!r.evb).slice(0,4),sc=[];
  for(let m=0;m<(1<<au.length);m++){
    const items=R.map(r=>{const x=au.indexOf(r);return{price:r.price,ev:r.ev,grp:r.grp,post:r.evb?r.evb==="post":(x>=0&&(m>>x&1)==1)}});
    const recs=base.concat([{date:"이번 영수증",total:tot,items}]);
    sc.push({m,recs,res:sysSolve(recs,G)});
  }
  const ok=sc.filter(x=>!x.res.bad.length);
  let det={},und=new Set(),stat={},loose=false,h="";
  if(!ok.length){
    const x=sc[0];und=x.res.und;stat=x.res.stat;
    const sp=suspects(x.recs,G,R);
    h+=`<div class="warn"><b>기존 기록과 안 맞아요.</b>${au.length?" 행사 전/후를 모두 시험했어요.":""} `+(sp.length?`원인 후보:`+sp.map(y=>`<br>· ${esc(R.find(r=>r.grp===y.g).name)}: 현재 ${y.old}%인데 이번 영수증은 ${y.need!=null?y.need+"%":"다른 할인율"}이어야 맞아요`).join(""):`원인을 하나로 좁히지 못했어요. 금액(수량 2개면 영수증 금액 칸), 전체 할인액, 행사 차감액을 확인하세요. (관련: ${[...new Set(x.res.bad.map(b=>b.date))].join(", ")})`)+`</div>`;
  }else{
    stat=ok[0].res.stat;loose=ok[0].res.loose;
    if(au.length){
      if(ok.length==1){au.forEach((r,x)=>setX(r.el.querySelector(`.b2 button[data-v="${(ok[0].m>>x&1)?"post":"pre"}"]`),"evb"));h+=`<div class="sub">행사 기준을 자동으로 정했어요: ${au.map((r,x)=>esc(r.name)+" "+((ok[0].m>>x&1)?"후":"전")).join(", ")}</div>`}
      else h+=`<div class="sub">행사 전/후 둘 다 맞아서 기준은 정하지 못했어요. 아는 경우 직접 골라 주세요.</div>`;
    }
    const vs=new Set(ok.flatMap(x=>[...Object.keys(x.res.det),...x.res.und]));
    vs.forEach(v=>{const a=ok.map(x=>x.res.det[v]);(a.every(y=>y!=null&&y===a[0]))?det[v]=a[0]:und.add(v)});
  }
  const known=new Set(Object.keys(grMap(editId)).concat(R.filter(r=>r.sel).map(r=>r.grp)));
  det0=R.filter(r=>r.grp in det&&!known.has(r.grp)).map(r=>[r,det[r.grp]]);
  const un=R.filter(r=>und.has(r.grp)&&!known.has(r.grp));
  if(det0.length)h+=`<div class="warn" style="background:var(--ok);color:var(--oktx)">확정: ${det0.map(([r,x])=>esc(r.name)+" "+x+"%").join(", ")}</div>`;
  if(un.length)h+=`<div class="warn">미정: ${un.map(r=>esc(r.name)+(stat[r.grp]?` (10% ${stat[r.grp][0]}/${stat[r.grp][1]})`:"")).join(", ")}<br>미확정으로 저장되고, 나중에 확정되면 자동으로 채워져요. 아는 품목은 직접 눌러도 돼요.</div>`;
  if(loose)h+=`<div class="sub">정확히 맞는 조합이 없어 10원 오차까지 포함했어요.</div>`;
  const rt=R.map(r=>G[r.grp]!=null?G[r.grp]:det[r.grp]);
  if(ok.length&&rt.every(x=>x!=null)){const sm=R.reduce((a,r,i)=>a+r10((r.price-(r.el.dataset.evb==="post"?r.ev:0))*rt[i]/100),0),d=tot-sm;h+=`<div class="sub">검산: 계산 ${won(sm)}원 / 영수증 ${won(tot)}원 ${d?`(차이 ${won(d)}원)`:"(일치)"}</div>`}
  if(!h)h=`<div class="warn">모든 품목의 할인율이 이미 정해져 있어요.</div>`;
  $("#cd").innerHTML=h+(det0.length?`<button class="cand" onclick="apply()">확정분 적용</button>`:"");
}
function apply(){det0.forEach(([r,x])=>setX(r.el.querySelector(`.r1 button[data-v="${x}"]`),"rate"));msg("확정분을 적용했어요.")}
async function save(){
  try{
    const date=$("#fd").value,store=$("#fs").value.trim(),tv=$("#tot").value,tot=tv?num(tv):null,R=readRows();
    if(!date||!R.length)return msg("날짜와 품목을 입력하세요.");
    for(const r of R)if(!r.name||!r.price)return msg("품목명과 금액을 입력하세요.");
    const gr=grMap(editId),its=R.map(r=>({name:r.name,qty:"",price:r.price,ev:r.ev,evm:r.ev?r.evm:"",evb:r.ev?r.evb:"",grp:r.grp,rate:r.sel?+r.sel:(r.grp in gr?gr[r.grp]:null)}));
    msg("저장 중…");
    const o={date,store,total:tot,items:its};
    editId?await api("PATCH",editId,enc(o)):await api("POST","",enc(o));
    const np=its.filter(i=>i.rate==null).length;
    closeForm();msg(np?`저장했어요. 미정 ${np}건은 다른 기록과 합쳐 자동으로 확정해 볼게요.`:"저장했어요.");await load();
  }catch(e){msg("저장 실패: "+e.message)}
}
function ed(id){openForm(rcps.find(r=>r.id===id))}
async function delR(){if(!confirm("이 영수증을 삭제할까요?"))return;try{await api("DELETE",editId);closeForm();await load()}catch(e){msg("삭제 실패: "+e.message)}}

$("#q").oninput=render;
$("#lg").onclick=()=>{
  if(owner){localStorage.removeItem("rt");tok=null;owner=false;closeForm();return}
  $("#lgbox").innerHTML=`<div class="card"><div class="f"><input id="em" type="email" placeholder="이메일"><input id="pw" type="password" placeholder="비밀번호"></div><button class="p" style="width:100%;margin-top:8px" onclick="login()">로그인</button></div>`;
};
(async()=>{
  try{owner=!!(await auth())}catch(e){}
  try{await load()}catch(e){msg("불러오기 실패: "+e.message);render()}
})();
</script>
</body>
